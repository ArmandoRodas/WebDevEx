<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Videos Educativos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="navbar">
    <div class="nav-brand">
      <span class="brand-badge">UMG</span>
      <h1>Edu<span>Videos</span></h1>
    </div>

    <!-- Buscador en tiempo real -->
    <div class="nav-search">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 Buscar videos por título o palabra clave..." 
        oninput="handleSearch(this.value)"
      />
    </div>

    <!-- Acceso de usuario / Estado de sesión -->
    <div class="nav-auth" id="navAuthSection">
      <button class="btn-primary-sm" onclick="openAuthModal('login')">Iniciar Sesión</button>
      <button class="btn-secondary-sm" onclick="openAuthModal('register')">Registrarse</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-container">
    
    <!-- Filtros de Categoría -->
    <section class="filter-section">
      <span class="filter-label">Categorías:</span>
      <div class="filter-chips" id="categoryChips">
        <button class="chip active" onclick="filterByCategory('todas')">Todas</button>
      </div>
    </section>

    <!-- Galería de Videos -->
    <section class="gallery-section">
      <div class="gallery-header">
        <h2 id="galleryTitle">Todos los Videos</h2>
        <span id="videoCountBadge" class="count-badge">Cargando videos...</span>
      </div>

      <div class="video-grid" id="videoGrid">
        <!-- Tarjetas generadas por JS -->
      </div>
    </section>
  </main>

  <!-- MODAL: REPRODUCTOR DE VIDEO Y DETALLES -->
  <div id="videoModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeVideoModal()"></div>
    <div class="modal-content video-modal-box">
      <button class="modal-close" onclick="closeVideoModal()">&times;</button>
      
      <div class="player-wrapper">
        <video id="mainVideoPlayer" controls playsinline></video>
      </div>

      <div class="modal-video-info">
        <div class="video-meta">
          <span class="video-category" id="modalCategory">Categoría</span>
          <span class="video-duration" id="modalDuration">00:00</span>
        </div>
        <h2 id="modalTitle">Título del Video</h2>
        <p id="modalDescription">Descripción del video</p>

        <!-- Barra interactiva (Like y comentarios) -->
        <div class="interaction-bar">
          <button id="btnLike" class="btn-like" onclick="handleLikeClick()">
            ❤️ <span id="modalLikesCount">0</span> Me gusta
          </button>
          <span id="authNotice" class="auth-notice hidden">⚠️ Inicia sesión para interactuar</span>
        </div>

        <hr class="divider" />

        <!-- Sección de Comentarios -->
        <div class="comments-section">
          <h3>Comentarios (<span id="modalCommentCount">0</span>)</h3>

          <!-- Formulario de nuevo comentario (restringido visualmente) -->
          <div id="newCommentBox" class="new-comment-box">
            <!-- Renderizado dinámicamente según sesión -->
          </div>

          <!-- Listado de comentarios -->
          <div class="comments-list" id="commentsList">
            <!-- Comentarios y respuestas -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: AUTENTICACIÓN Y REGISTRO (SERIE I) -->
  <div id="authModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeAuthModal()"></div>
    <div class="modal-content auth-modal-box">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      
      <div class="header">
        <h2>Plataforma Educativa</h2>
        <p>Inicia sesión o regístrate para interactuar</p>
      </div>

      <div class="tabs">
        <button id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
        <button id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Registro</button>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <!-- Formulario Login -->
      <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUser">Carné o Correo Electrónico</label>
          <input type="text" id="loginUser" placeholder="1890-20-11489 o usuario@correo.com" required />
        </div>
        <div class="form-group">
          <label for="loginPass">Contraseña (PIN numérico)</label>
          <input type="password" id="loginPass" placeholder="Tu PIN numérico" inputmode="numeric" pattern="[0-9]+" required />
        </div>
        <button type="submit" id="btnLoginSubmit" class="btn-primary">Entrar a la Plataforma</button>
      </form>

      <!-- Formulario Registro -->
      <form id="registerForm" class="form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regCarne">Número de Carné (9999-99-99999)</label>
          <input type="text" id="regCarne" placeholder="1890-20-11489" maxlength="13" required />
          <small class="hint">Formato: 4 dígitos - 2 dígitos - 5 dígitos</small>
        </div>
        <div class="form-group">
          <label for="regName">Nombre Completo</label>
          <input type="text" id="regName" placeholder="JUAN PEREZ" required />
        </div>
        <div class="form-group">
          <label for="regEmail">Correo Electrónico</label>
          <input type="email" id="regEmail" placeholder="usuario@dominio.com" required />
        </div>
        <div class="form-group">
          <label for="regPass">Contraseña PIN (Solo números)</label>
          <input type="password" id="regPass" placeholder="Ej: 1234" inputmode="numeric" pattern="[0-9]+" required />
        </div>
        <button type="submit" id="btnRegSubmit" class="btn-primary">Registrar Estudiante</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
